<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->

    <meta
      name="description"
      content="ChatNow is a simple, fast and secure online chat platform. Connect and communicate with people instantly."

    <meta
      property="og:title"

    />
